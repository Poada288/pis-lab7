{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{{ post.title }}</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body class="article">
    <div class="content">
        <div class="header">
            <img src="{% static 'img/logo.svg' %}" alt="Django public blog">
            <nav class="account-links">
                <a class="all-posts" href="{% url 'register' %}">Регистрация</a>
                {% if user.is_authenticated %}
                <span>{{ user.username }}</span>
                {% else %}
                <a class="all-posts" href="{% url 'sign_in' %}">Вход</a>
                {% endif %}
            </nav>
            <a class="all-posts" href="{% url 'archive' %}">Все записи</a>
        </div>
        <h1 class="post-title">{{ post.title }}</h1>
        <div class="article-info">
            <div class="article-author">{{ post.author.username }}</div>
            <div class="article-created-date">{{ post.created_date }}</div>
        </div>
        <div class="article-text">{{ post.text|linebreaks }}</div>
    </div>
</body>
</html>
